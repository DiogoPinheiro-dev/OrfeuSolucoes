name: Qualidade

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-and-contracts:
    name: Estática e contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Instalar frontend
        working-directory: client
        run: npm ci
      - name: Instalar backend
        working-directory: server
        run: npm ci
      - name: Auditar testes focados ou desativados
        run: node scripts/ci-static-audit.mjs
      - name: Conferir manifesto do produto
        working-directory: server
        run: npm run catalogo:check
      - name: Validar frontend estaticamente
        working-directory: client
        run: npm run lint
      - name: Validar documentação executável
        working-directory: server
        run: npm run test:documentation
      - name: Verificar integridade textual do commit
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependências
        working-directory: server
        run: npm ci
      - name: Gerar cliente Prisma
        working-directory: server
        run: npm run prisma:generate
      - name: Executar regressão
        working-directory: server
        run: npm run test:regression
      - name: Executar cobertura
        working-directory: server
        run: npm run test:coverage
      - name: Publicar cobertura do backend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-backend
          path: server/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Instalar dependências
        working-directory: client
        run: npm ci
      - name: Executar gate de qualidade
        working-directory: client
        run: npm run test:quality
      - name: Executar cobertura
        working-directory: client
        run: npm run test:coverage
      - name: Publicar cobertura do frontend
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-frontend
          path: client/coverage
          if-no-files-found: ignore

  prisma-and-migrations:
    name: Prisma e migrations
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: OrfeuCi_Sql2026!
        ports:
          - 1433:1433
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=OrfeuCi;user=sa;password=OrfeuCi_Sql2026!;encrypt=true;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependências
        working-directory: server
        run: npm ci
      - name: Aguardar SQL Server e criar banco limpo
        run: |
          for attempt in {1..30}; do
            if docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuCi_Sql2026!' -C -Q "IF DB_ID('OrfeuCi') IS NULL CREATE DATABASE [OrfeuCi]"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Validar schema
        working-directory: server
        run: npx prisma validate
      - name: Aplicar migrations desde zero
        working-directory: server
        run: npx prisma migrate deploy
      - name: Confirmar estado das migrations
        working-directory: server
        run: npx prisma migrate status
      - name: Conferir que o banco novo ficou vazio
        working-directory: server
        run: node scripts/base-consolidada/verify-installation.cjs --expect-empty
      - name: Instalar na primeira subida e provar que as seguintes so leem
        working-directory: server
        env:
          NODE_ENV: production
          APP_ENV: homologation
          CORS_ORIGIN: http://127.0.0.1:4173
          JWT_SECRET: quality-installation-jwt-secret-2026-validation
          GOOGLE_TOKEN_ENCRYPTION_KEY: quality-installation-google-token-key-2026
          INITIAL_ADMIN_PASSWORD: OrfeuCi_Admin2026!
        run: |
          npm run build
          subir() {
            PORT="$1" node dist/main.js > "$2" 2>&1 &
            local pid=$!
            for attempt in {1..60}; do
              if curl --fail --silent -H 'Content-Type: application/json' -H "Origin: $CORS_ORIGIN" --data '{"query":"{ health }"}' "http://127.0.0.1:$1/graphql" | grep -q '"health":"ok"'; then
                kill "$pid"; wait "$pid" || true
                return 0
              fi
              sleep 2
            done
            cat "$2"; kill "$pid" || true
            return 1
          }
          subir 3001 instalacao-1.log
          grep -q 'Instalacao inicial concluida' instalacao-1.log
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --write-hash instalacao.sha256
          subir 3001 instalacao-2.log
          if grep -q 'Instalacao inicial concluida' instalacao-2.log; then echo 'A segunda subida instalou de novo.'; exit 1; fi
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --compare-hash instalacao.sha256
          npx prisma db seed
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --compare-hash instalacao.sha256
      - name: Instalar com duas instancias ao mesmo tempo
        working-directory: server
        env:
          NODE_ENV: production
          APP_ENV: homologation
          CORS_ORIGIN: http://127.0.0.1:4173
          JWT_SECRET: quality-installation-jwt-secret-2026-validation
          GOOGLE_TOKEN_ENCRYPTION_KEY: quality-installation-google-token-key-2026
          INITIAL_ADMIN_PASSWORD: OrfeuCi_Admin2026!
        run: |
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuCi_Sql2026!' -C -b -Q "CREATE DATABASE [OrfeuCiConcorrente]"
          export DATABASE_URL="${DATABASE_URL/database=OrfeuCi;/database=OrfeuCiConcorrente;}"
          npx prisma migrate deploy
          PORT=3002 node dist/main.js > concorrente-1.log 2>&1 &
          primeira=$!
          PORT=3003 node dist/main.js > concorrente-2.log 2>&1 &
          segunda=$!
          for porta in 3002 3003; do
            for attempt in {1..60}; do
              if curl --fail --silent -H 'Content-Type: application/json' -H "Origin: $CORS_ORIGIN" --data '{"query":"{ health }"}' "http://127.0.0.1:$porta/graphql" | grep -q '"health":"ok"'; then
                break
              fi
              test "$attempt" -lt 60 || { cat concorrente-1.log concorrente-2.log; exit 1; }
              sleep 2
            done
          done
          kill "$primeira" "$segunda"; wait "$primeira" "$segunda" || true
          test "$(grep -c 'Instalacao inicial concluida' concorrente-1.log concorrente-2.log | awk -F: '{ total += $2 } END { print total }')" = "1"
          node scripts/base-consolidada/verify-installation.cjs --expect-installed
      - name: Publicar logs da instalacao
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-instalacao-limpa
          path: server/*.log
          if-no-files-found: ignore

  security:
    name: Segurança de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar frontend
        working-directory: client
        run: npm ci
      - name: Instalar backend
        working-directory: server
        run: npm ci
      - name: Auditar dependências de produção do frontend
        id: audit-frontend
        continue-on-error: true
        working-directory: client
        run: npm audit --omit=dev --audit-level=high --json > audit-frontend.json
      - name: Auditar dependências de produção do backend
        id: audit-backend
        continue-on-error: true
        working-directory: server
        run: npm audit --omit=dev --audit-level=high --json > audit-backend.json
      - name: Publicar relatórios de segurança
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auditoria-dependencias
          path: |
            client/audit-frontend.json
            server/audit-backend.json
          if-no-files-found: ignore
      - name: Aplicar gate de segurança
        if: always()
        run: |
          test "${{ steps.audit-frontend.outcome }}" = "success"
          test "${{ steps.audit-backend.outcome }}" = "success"

  browser:
    name: Navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Instalar dependências
        working-directory: client
        run: npm ci
      - name: Gerar build de homologação
        working-directory: client
        run: npm run build
      - name: Executar jornadas no navegador
        working-directory: client
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          npm run test:e2e:browser
      - name: Publicar evidências do navegador
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-navegador
          path: |
            client/cypress/artifacts
            client/preview.log
          if-no-files-found: ignore
