name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  database-rehearsal:
    name: Instalação, backup e restauração
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: OrfeuRc_Sql2026!
        ports:
          - 1433:1433
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=OrfeuRc;user=sa;password=OrfeuRc_Sql2026!;encrypt=true;trustServerCertificate=true"
      NODE_ENV: production
      APP_ENV: homologation
      PORT: 3001
      CORS_ORIGIN: http://127.0.0.1:4173
      JWT_SECRET: release-candidate-jwt-secret-2026-validation
      GOOGLE_TOKEN_ENCRYPTION_KEY: release-candidate-google-token-key-2026
      INITIAL_ADMIN_PASSWORD: OrfeuRc_Admin2026!
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar backend em ambiente limpo
        working-directory: server
        run: npm ci --include=dev
      - name: Criar banco novo e aplicar as migrations
        working-directory: server
        run: |
          for attempt in {1..30}; do
            if docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuRc_Sql2026!' -C -Q "IF DB_ID('OrfeuRc') IS NULL CREATE DATABASE [OrfeuRc]"; then
              break
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 2
          done
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
          node scripts/base-consolidada/verify-installation.cjs --expect-empty
      - name: Preparar a subida do runtime
        working-directory: server
        run: |
          npm run build
          cat > /tmp/subir.sh <<'SCRIPT'
          # Sobe o backend, confere saúde e CORS e encerra; o log fica no arquivo informado.
          subir() {
            node dist/main.js > "$1" 2>&1 &
            local pid=$!
            for attempt in {1..60}; do
              if curl --fail --silent --show-error -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:4173' --data '{"query":"{ health }"}' http://127.0.0.1:3001/graphql | grep -q '"health":"ok"'; then
                local cors_code
                cors_code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: https://origem-invalida.orfeu.test' --data '{"query":"mutation { logout }"}' http://127.0.0.1:3001/graphql)
                kill "$pid"; wait "$pid" || true
                test "$cors_code" = "403"
                return $?
              fi
              sleep 2
            done
            cat "$1"; kill "$pid" || true
            return 1
          }
          SCRIPT
      - name: Instalar na primeira subida
        working-directory: server
        run: |
          source /tmp/subir.sh
          subir runtime-1.log
          grep -q 'Instalacao inicial concluida' runtime-1.log
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --write-hash /tmp/instalacao.sha256
      - name: Criar backup recuperável
        run: |
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuRc_Sql2026!' -C -b -Q "BACKUP DATABASE [OrfeuRc] TO DISK = N'/var/opt/mssql/data/orfeu-instalado.bak' WITH INIT, CHECKSUM"
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuRc_Sql2026!' -C -b -Q "RESTORE VERIFYONLY FROM DISK = N'/var/opt/mssql/data/orfeu-instalado.bak' WITH CHECKSUM"
      - name: Subir de novo sem escrever no banco
        working-directory: server
        run: |
          source /tmp/subir.sh
          subir runtime-2.log
          if grep -q 'Instalacao inicial concluida' runtime-2.log; then echo 'A segunda subida instalou de novo.'; exit 1; fi
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --compare-hash /tmp/instalacao.sha256
      - name: Ensaiar a restauração do backup
        working-directory: server
        run: |
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrfeuRc_Sql2026!' -C -b -Q "ALTER DATABASE [OrfeuRc] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; RESTORE DATABASE [OrfeuRc] FROM DISK = N'/var/opt/mssql/data/orfeu-instalado.bak' WITH REPLACE, RECOVERY; ALTER DATABASE [OrfeuRc] SET MULTI_USER"
          npx prisma migrate status
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --compare-hash /tmp/instalacao.sha256
          source /tmp/subir.sh
          subir runtime-3.log
          node scripts/base-consolidada/verify-installation.cjs --expect-installed --compare-hash /tmp/instalacao.sha256
      - name: Publicar evidências do ensaio
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-release-candidate
          path: server/runtime-*.log
          if-no-files-found: ignore
